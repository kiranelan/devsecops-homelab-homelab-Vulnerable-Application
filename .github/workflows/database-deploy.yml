name: Deploy PostgreSQL Database

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DEPLOY to confirm the database deployment"
        required: true
        type: string

concurrency:
  group: database-deploy-lab
  cancel-in-progress: false

jobs:
  deploy-database:
    name: Deploy PostgreSQL to EKS
    runs-on: ubuntu-latest
    timeout-minutes: 20

    if: >
      github.ref == 'refs/heads/main' && inputs.confirmation == 'DEPLOY'

    environment: lab

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::854481201284:role/DevSecOpsLabTerraformRole
          aws-region: us-west-2
          role-session-name: devsecops-database-deploy

      - name: Set up kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: latest

      - name: Configure EKS access
        run: |
          aws eks update-kubeconfig \
            --region us-west-2 \
            --name eks-interview-lab

          kubectl auth can-i create deployments \
            --namespace database

      - name: Validate required GitHub secrets
        env:
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          test -n "$POSTGRES_DB" || {
            echo "POSTGRES_DB is not configured."
            exit 1
          }

          test -n "$POSTGRES_USER" || {
            echo "POSTGRES_USER is not configured."
            exit 1
          }

          test -n "$POSTGRES_PASSWORD" || {
            echo "POSTGRES_PASSWORD is not configured."
            exit 1
          }

      - name: Render and validate database manifests
        run: |
          kubectl kustomize database > database-rendered.yaml
          kubectl apply \
            --dry-run=client \
            --filename database-rendered.yaml

      - name: Create database namespace and credentials
        env:
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          kubectl apply --filename database/namespace.yaml

          kubectl create secret generic postgres-credentials \
            --namespace database \
            --from-literal=POSTGRES_DB="$POSTGRES_DB" \
            --from-literal=POSTGRES_USER="$POSTGRES_USER" \
            --from-literal=POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
            --dry-run=client \
            --output=yaml \
            | kubectl apply --filename -

      - name: Deploy PostgreSQL
        run: |
          kubectl apply --kustomize database

          kubectl rollout status deployment/postgres \
            --namespace database \
            --timeout=5m

      - name: Verify database resources
        run: |
          kubectl get deployment,pods,service \
            --namespace database \
            --output=wide

      - name: Verify initialized database
        env:
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
        run: |
          kubectl exec \
            --namespace database \
            deployment/postgres \
            -- psql \
            --username="$POSTGRES_USER" \
            --dbname="$POSTGRES_DB" \
            --command="SELECT COUNT(*) AS users FROM users; SELECT COUNT(*) AS posts FROM posts;"

      - name: Show diagnostic information
        if: failure()
        run: |
          kubectl get all --namespace database || true
          kubectl describe deployment/postgres \
            --namespace database || true
          kubectl get events \
            --namespace database \
            --sort-by='.lastTimestamp' || true
          kubectl logs deployment/postgres \
            --namespace database \
            --tail=100 || true

      - name: Add deployment summary
        if: success()
        run: |
          {
            echo "## PostgreSQL deployment"
            echo
            echo "- Cluster: \`eks-interview-lab\`"
            echo "- Namespace: \`database\`"
            echo "- Deployment: \`postgres\`"
            echo "- Service: \`postgres.database.svc.cluster.local:5432\`"
            echo "- Credentials source: GitHub environment secrets"
            echo "- Storage: temporary \`emptyDir\`"
          } >> "$GITHUB_STEP_SUMMARY"