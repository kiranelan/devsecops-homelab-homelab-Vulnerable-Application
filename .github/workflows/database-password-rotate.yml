name: Rotate Database Password

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type ROTATE to confirm database password rotation"
        required: true
        type: string

concurrency:
  group: database-deployment-lab
  cancel-in-progress: false

jobs:
  rotate-database-password:
    name: Synchronize PostgreSQL and Kubernetes secrets
    runs-on: ubuntu-latest
    timeout-minutes: 20

    if: >
      github.ref == 'refs/heads/main' &&
      inputs.confirmation == 'ROTATE'

    environment: lab

    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: us-west-2
      EKS_CLUSTER_NAME: eks-interview-lab
      POSTGRES_DB: vulnerable_app
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: latest

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::854481201284:role/DevSecOpsLabTerraformRole
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: devsecops-database-password-rotation

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

          kubectl get nodes

      - name: Validate protected password
        shell: bash
        run: |
          if [ -z "$POSTGRES_PASSWORD" ]; then
            echo "The lab environment secret POSTGRES_PASSWORD is missing."
            exit 1
          fi

          if [ "${#POSTGRES_PASSWORD}" -lt 24 ]; then
            echo "POSTGRES_PASSWORD must contain at least 24 characters."
            exit 1
          fi

          echo "::add-mask::$POSTGRES_PASSWORD"

      - name: Verify PostgreSQL deployment
        run: |
          kubectl rollout status deployment/postgres \
            --namespace database \
            --timeout=5m

      - name: Rotate PostgreSQL role password
        shell: bash
        run: |
          kubectl exec \
            --namespace database \
            deployment/postgres \
            --env="ROTATED_PASSWORD=${POSTGRES_PASSWORD}" \
            -- \
            sh -ec '
              psql \
                --username="$POSTGRES_USER" \
                --dbname="$POSTGRES_DB" \
                --set=ON_ERROR_STOP=1 \
                --set=rotated_password="$ROTATED_PASSWORD" <<'"'"'SQL'"'"'
          ALTER ROLE appuser WITH PASSWORD :'"'"'rotated_password'"'"';
          SQL
            '

      - name: Update database Kubernetes Secret
        shell: bash
        run: |
          kubectl create secret generic postgres-credentials \
            --namespace database \
            --from-literal=POSTGRES_DB="$POSTGRES_DB" \
            --from-literal=POSTGRES_USER="$POSTGRES_USER" \
            --from-literal=POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
            --dry-run=client \
            --output=yaml |
          kubectl apply -f -

      - name: Update application Kubernetes Secret
        shell: bash
        run: |
          kubectl create secret generic vulnerable-app-secrets \
            --namespace vulnerable-app \
            --from-literal=DB_HOST=postgres.database.svc.cluster.local \
            --from-literal=DB_PORT=5432 \
            --from-literal=DB_NAME="$POSTGRES_DB" \
            --from-literal=DB_USER="$POSTGRES_USER" \
            --from-literal=DB_PASSWORD="$POSTGRES_PASSWORD" \
            --dry-run=client \
            --output=yaml |
          kubectl apply -f -

      - name: Verify password synchronization
        shell: bash
        run: |
          DATABASE_HASH="$(
            kubectl get secret postgres-credentials \
              --namespace database \
              --output jsonpath='{.data.POSTGRES_PASSWORD}' |
            base64 --decode |
            sha256sum |
            awk '{print $1}'
          )"

          APPLICATION_HASH="$(
            kubectl get secret vulnerable-app-secrets \
              --namespace vulnerable-app \
              --output jsonpath='{.data.DB_PASSWORD}' |
            base64 --decode |
            sha256sum |
            awk '{print $1}'
          )"

          if [ "$DATABASE_HASH" != "$APPLICATION_HASH" ]; then
            echo "Database and application passwords do not match."
            exit 1
          fi

          echo "Database and application passwords are synchronized."

      - name: Restart Flask application
        run: |
          kubectl rollout restart deployment/vulnerable-app \
            --namespace vulnerable-app

          kubectl rollout status deployment/vulnerable-app \
            --namespace vulnerable-app \
            --timeout=5m

      - name: Verify application readiness
        shell: bash
        run: |
          POD_NAME="$(
            kubectl get pods \
              --namespace vulnerable-app \
              --selector=app.kubernetes.io/name=vulnerable-app \
              --field-selector=status.phase=Running \
              --sort-by=.metadata.creationTimestamp \
              --output jsonpath='{.items[-1:].metadata.name}'
          )"

          test -n "$POD_NAME"

          kubectl exec \
            --namespace vulnerable-app \
            "$POD_NAME" \
            -- \
            python -c \
              'import urllib.request; response = urllib.request.urlopen("http://127.0.0.1:5000/readyz"); assert response.status == 200; print(response.read().decode())'

      - name: Add rotation summary
        if: success()
        run: |
          {
            echo "## Database password rotation"
            echo
            echo "- PostgreSQL role password updated"
            echo "- Database Kubernetes Secret updated"
            echo "- Application Kubernetes Secret updated"
            echo "- Secret synchronization verified"
            echo "- Flask deployment restarted"
            echo "- Flask readiness verified"
            echo
            echo "No secret values were written to the workflow summary."
          } >> "$GITHUB_STEP_SUMMARY"