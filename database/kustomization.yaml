apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml

configMapGenerator:
  - name: postgres-init
    namespace: database
    files:
      - init-db.sql

generatorOptions:
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: devsecops-interview-lab