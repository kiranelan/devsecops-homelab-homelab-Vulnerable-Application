# PostgreSQL Helm Chart Values
# This file provides a starting point for configuring PostgreSQL
# Candidates should customize these values for their deployment

# Global settings
global:
  postgresql:
    auth:
      username: "appuser"
      database: "vulnerable_app"
      existingSecret: "postgres-credentials"
      secretKeys:
        adminPasswordKey: "postgres-password"
        userPasswordKey: "password"

# Primary configuration
primary:
  persistence:
    enabled: true
    size: 10Gi
    storageClass: "gp3"
  
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  
  # Health checks
  livenessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
  
  readinessProbe:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 5
  
  # Security context
  securityContext:
    enabled: true
    runAsUser: 1001
    runAsGroup: 1001
    fsGroup: 1001

# Service configuration
service:
  type: ClusterIP
  ports:
    postgresql: 5432

# Network policies (optional)
networkPolicy:
  enabled: true

# Monitoring (optional)
metrics:
  enabled: false
