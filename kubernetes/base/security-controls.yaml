apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: vulnerable-app
  namespace: vulnerable-app
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vulnerable-app
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vulnerable-app
  namespace: vulnerable-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vulnerable-app
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: vulnerable-app
  namespace: vulnerable-app
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 4Gi
